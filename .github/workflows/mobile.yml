# Named so that mobile-update.yml can follow it (`workflow_run` matches workflows by name).
name: Mobile tests

# Runs when the mobile app, the shared packages or the workspace's dependencies change.
on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - vite.config.ts
      - .github/workflows/mobile.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - vite.config.ts
      - .github/workflows/mobile.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      # pnpm's version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Oxlint with the root vite.config.ts; run from here it lints mobile/ only.
      - run: pnpm lint
      # Not `pnpm test -- --ci`: pnpm 11 passes the `--` on to jest literally.
      - run: pnpm test --ci
