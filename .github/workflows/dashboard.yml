name: Dashboard tests

# Runs when the dashboard, the shared packages or the workspace's dependencies change.
on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - vite.config.ts
      - .github/workflows/dashboard.yml
  pull_request:
    branches: [main]
    paths:
      - dashboard/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - vite.config.ts
      - .github/workflows/dashboard.yml

# A newer push to the same PR cancels the run it supersedes; pushes to main each get their own group
# (the SHA), so every commit on main is tested in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole Vitest suite runs in seconds with vmThreads (jsdom is shared per worker), so one job
  # beats several shards that each pay the checkout and install cost.
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      # Installs the whole workspace (`vp install` at the root) from the cached pnpm store.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - run: vp test run

  # Type check, production build and its runtime assets, beside the tests.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - run: vp run build

      # The map's worker and glyph/sprite assets are found by URL at runtime, so nothing in the unit
      # tests (jsdom, mocked map) notices if the build stops emitting them: the map would ship blank.
      - name: Build emits the map's worker, fonts and sprites
        run: |
          ls dist/assets/maplibre-gl-worker-*.mjs
          test -f "dist/maps/fonts/Noto Sans Regular/0-255.pbf"
          test -f dist/maps/sprites/v4/dark.json
          test -f dist/maps/sprites/v4/light.json

  # `test` is the status check the main branch ruleset requires: it passes only when the tests and
  # the build passed. `always()` keeps it from being skipped (a skipped check counts as passed).
  test:
    needs: [vitest, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests and build passed
        run: |
          echo "vitest: ${{ needs.vitest.result }}, build: ${{ needs.build.result }}"
          test "${{ needs.vitest.result }}" = success
          test "${{ needs.build.result }}" = success
