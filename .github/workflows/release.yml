name: Release
run-name: Release ${{ inputs.version && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || format('{0} bump', inputs.bump) }}${{ inputs.prerelease && ' (pre-release)' || '' }}

# Releases the dashboard (the `v*` tags and ghcr.io/renewvan/dashboard). The mobile app is not
# released here: it ships through EAS (mobile-update.yml).
# Start a release from the Actions tab or `gh workflow run release.yml -f bump=minor`.
# The process lives in renewvan/hub (docs/adr/0015); this file only says what this repo ships.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest release's version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit version (e.g. 0.2.0 or 0.2.0-beta.1); overrides "bump"'
        type: string
        required: false
      prerelease:
        description: 'Pre-release (a beta from a feature branch): tests gate it, `main` and `:latest` stay untouched'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    # Pinned to the hub commit that added the dockerfile/package-json inputs (renewvan/hub#206).
    uses: renewvan/hub/.github/workflows/release.yml@c451d5f3dc6d17500a83c99b6b723d19250cf1c7
    with:
      kind: image
      image: dashboard
      # Built with the workspace root as context, so packages/ is in the image's build.
      dockerfile: apps/dashboard/Dockerfile
      stamp-package-json: true
      package-json: apps/dashboard/package.json
      node-version-file: .node-version
      test-command: cd apps/dashboard && vp test run
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
