name: Brand

# Runs when the brand package, anything it generates or the workspace's dependencies change: the
# generated CSS, palette, logo, icons and manifest colours must match src/tokens.ts and svg/. Both
# apps' workflows run on packages/** too, so a brand change is also checked where it is used.
on:
  push:
    branches: [main]
    paths:
      - packages/brand/**
      - dashboard/public/**
      - dashboard/index.html
      - mobile/assets/**
      - mobile/app.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - vite.config.ts
      - .github/workflows/brand.yml
  pull_request:
    branches: [main]
    paths:
      - packages/brand/**
      - dashboard/public/**
      - dashboard/index.html
      - mobile/assets/**
      - mobile/app.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - vite.config.ts
      - .github/workflows/brand.yml

# A newer push to the same PR cancels the run it supersedes; pushes to main each get their own group
# (the SHA), so every commit on main is tested in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brand
    steps:
      - uses: actions/checkout@v5

      # Installs the whole workspace (`vp install` at the root).
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - run: vp run typecheck
      - run: vp test run
      # Regenerates in memory and fails if a committed output differs (icons by their pixels).
      - run: vp run generate --check
